name: build-uac2

on:
  workflow_dispatch:
  push:
    branches: [lineage-20]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev cpio kmod rsync \
            python3 curl xz-utils patch gzip tar make git \
            clang-14 lld-14 llvm-14 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: 编译（含 UAC2）
        env:
          JOBS: '4'
          CC_BIN: clang-14
        run: |
          chmod +x ci/build-uac2.sh
          ./ci/build-uac2.sh 2>&1 | tee build-uac2.log

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Image-uac2-${{ github.run_number }}
          path: |
            out/Image
            out/.config
            build-uac2.log
          retention-days: 14
