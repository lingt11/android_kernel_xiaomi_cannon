name: build-uac2

on:
  workflow_dispatch:
  push:
    branches: [lineage-20]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev cpio kmod rsync \
            python3 curl xz-utils patch gzip tar make git \
            clang-14 lld-14 llvm-14 gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: 准备 ld.lld 名字
        run: |
          ls -l /usr/bin/ld.lld* 2>/dev/null || true
          sudo ln -sf "$(command -v ld.lld-14 || command -v lld-14 || echo /usr/bin/ld.lld-14)" /usr/local/bin/ld.lld
          ld.lld --version | head -1

      - name: 编译（含 UAC2）
        env:
          JOBS: '4'
          CC_BIN: clang-14
        run: |
          set -o pipefail
          chmod +x ci/build-uac2.sh
          ./ci/build-uac2.sh 2>&1 | tee build-uac2.log

      - name: 失败时保存日志尾部
        if: failure()
        run: tail -300 build-uac2.log > /tmp/tail.log || true

      - name: 上传失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fail-log-${{ github.run_number }}
          path: /tmp/tail.log
          retention-days: 3

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: Image-uac2-${{ github.run_number }}
          path: |
            out/Image
            out/config.final.txt
            build-uac2.log
          if-no-files-found: error
          retention-days: 14
